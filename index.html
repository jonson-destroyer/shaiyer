<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#1f5a34">
<title>ミカン カウンター</title>
<style>
  :root { --bg:#f6f3ea; --ink:#1d2b1f; --leaf:#1f5a34; --mikan:#f08a12; --line:#cfc8b4; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:system-ui,"Hiragino Sans","Noto Sans JP",sans-serif; }
  main { max-width:640px; margin:0 auto; padding:env(safe-area-inset-top) 12px 24px; }
  h1 { font-size:1.1rem; margin:12px 0 8px; }
  #view { position:relative; background:#000; border-radius:10px; overflow:hidden; min-height:120px; }
  canvas { width:100%; display:block; }
  #hud { position:absolute; left:8px; top:8px; background:rgba(0,0,0,.62); color:#fff; padding:4px 12px 6px; border-radius:8px; }
  #big { font-size:2.4rem; font-weight:700; line-height:1.1; }
  #hud small { display:block; font-size:.75rem; line-height:1.4; }
  #status { font-size:.85rem; margin:8px 0; min-height:1.2em; }
  .row { display:flex; gap:8px; flex-wrap:wrap; margin:8px 0; align-items:center; }
  button, select { font:inherit; padding:10px 14px; border-radius:8px; border:2px solid var(--leaf); background:#fff; color:var(--leaf); font-weight:600; }
  button.main { background:var(--mikan); border-color:var(--mikan); color:#fff; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline:3px solid var(--mikan); outline-offset:2px; }
  input[type=text] { font:inherit; padding:8px; border:2px solid var(--line); border-radius:8px; width:8em; }
  input[type=number] { font:inherit; padding:8px; border:2px solid var(--line); border-radius:8px; width:5.5em; }
  label { font-size:.85rem; }
  .tw { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; font-size:.78rem; margin-top:8px; white-space:nowrap; }
  th, td { border-bottom:1px solid var(--line); padding:4px 6px; text-align:right; }
  th:first-child, td:first-child { text-align:left; }
</style>
</head>
<body>
<main>
  <h1>ミカン カウンター(摘果前・端末内処理)</h1>
  <div id="view">
    <canvas id="cv" width="640" height="360"></canvas>
    <div id="hud">
      <div id="big">0</div>
      <small id="modeLabel">いま映っている数</small>
      <small id="info">FPS - / - × -</small>
      <small id="mk">marker 0</small>
    </div>
  </div>
  <div id="status">モデルを読み込み中…</div>
  <div id="diag" style="font-size:.75rem;color:#555;word-break:break-all"></div>

  <div class="row">
    <button id="start" class="main">カメラ開始</button>
    <button id="reset">累計リセット</button>
    <button id="mode">表示切替:フレーム/累計</button>
    <button id="retry">スレッド再試行</button>
  </div>
  <div class="row">
    <input type="file" id="photo" accept="image/*" multiple hidden>
    <button id="photoBtn" class="main">写真から数える(複数選択可)</button>
  </div>
  <div class="row">
    <input type="file" id="vfile" accept="video/*" hidden>
    <button id="vidBtn" class="main">動画から数える</button>
    <label>間隔
      <select id="vstep">
        <option value="0.1">0.1秒ごと(細かい・遅い)</option>
        <option value="0.2" selected>0.2秒ごと</option>
        <option value="0.3">0.3秒ごと</option>
        <option value="0.5">0.5秒ごと(速い・粗い)</option>
      </select>
    </label>
  </div>
  <div class="row">
    <label>動画の範囲 開始 <input type="number" id="vfrom" min="0" step="0.1" placeholder="0"> 秒</label>
    <label>終了 <input type="number" id="vto" min="0" step="0.1" placeholder="最後まで"> 秒</label>
  </div>
  <div id="vlog" style="font-size:.75rem;color:#555;word-break:break-all"></div>
  <div class="row">
    <label>解像度
      <select id="res">
        <option value="640x480">640×480</option>
        <option value="1280x720" selected>1280×720</option>
        <option value="1920x1080">1920×1080</option>
      </select>
    </label>
    <label>信頼度 <input type="range" id="conf" min="0.05" max="0.9" step="0.05" value="0.35"> <span id="confv">0.35</span></label>
  </div>
  <div class="row">
    <label>木のID <input type="text" id="tree" value="T01"></label>
    <label>条件 <input type="text" id="cond" placeholder="遠 / 近 / 3m" style="width:7em"></label>
    <button id="rec" class="main">この木を記録</button>
    <button id="csv">CSV(記録まとめ)</button>
    <button id="wcsv">CSV(画像ごと・横並び)</button>
    <button id="dcsv">CSV(1個ずつ・縦)</button>
    <button id="tcsv">CSV(動画の時間経過)</button>
    <button id="clr">記録を消す</button>
  </div>
  <div class="tw"><table id="tbl"><thead><tr>
    <th>時刻</th><th>木</th><th>条件</th><th>最大</th><th>累計</th><th>marker</th><th>FPS</th><th>解像度</th><th>秒</th>
  </tr></thead><tbody></tbody></table></div>
</main>

<script src="./lib/ort.wasm.min.js"></script>
<script>
"use strict";
const MODEL_URL = "./model/best.onnx";
const SIZE = 640, IOU_NMS = 0.5;
const CLS_MARKER = 0, CLS_MIKAN = 1;   // names: {0:'marker', 1:'mikan'}

const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const cv = $("cv"), ctx = cv.getContext("2d");
const video = document.createElement("video");
video.playsInline = true; video.muted = true; video.preload = "auto";
const pre = document.createElement("canvas"); pre.width = pre.height = SIZE;
const pctx = pre.getContext("2d", { willReadFrequently: true });
const buf = new Float32Array(3 * SIZE * SIZE);

let lastAll = [], recSeq = 0;
let photoState = null, photoQueue = [], photoUrl = null, inferBusy = false;
let threads = 1, session = null, running = false, showTotal = false, stream = null;
let mikanNow = 0, mikanMax = 0, markerNow = 0, markerMax = 0, totalCount = 0;
let tracks = [], nextId = 1, shift = { x: 0, y: 0 };
let records = [];
let sessFrames = 0, sessStart = performance.now();   // 記録用の平均FPS
let fpsFrames = 0, fpsStart = performance.now(), fpsNow = 0; // 表示用FPS
// 動画モード
let videoJob = null, videoUrl = null, lastSrc = "camera", videoDur = 0, timeline = [];

async function loadModel() {
  const abs = f => new URL(f, location.href).href;
  try {
    ort.env.wasm.wasmPaths = {
      mjs: abs("./lib/ort-wasm-simd-threaded.mjs"),
      wasm: abs("./lib/ort-wasm-simd-threaded.wasm") };
    threads = (crossOriginIsolated && !sessionStorage.getItem("nothreads"))
      ? Math.min(4, navigator.hardwareConcurrency || 2) : 1;
    ort.env.wasm.numThreads = threads;
    session = await ort.InferenceSession.create(MODEL_URL, { executionProviders: ["wasm"] });
    $("status").textContent = `準備OK(スレッド数 ${threads})。「カメラ開始」を押してください。`;
    const sw = navigator.serviceWorker && navigator.serviceWorker.controller ? "有" : "無";
    $("diag").textContent = `診断: isolated=${crossOriginIsolated} / SW制御=${sw} / nothreads=${sessionStorage.getItem("nothreads") || "-"} / 失敗理由=${sessionStorage.getItem("threadErr") || "-"}`;
  } catch (e) {
    if (threads > 1) { sessionStorage.setItem("threadErr", String(e.message).slice(0, 200)); sessionStorage.setItem("nothreads", "1"); location.reload(); return; }
    let diag = "";
    for (const f of ["./lib/ort.wasm.min.js", "./lib/ort-wasm-simd-threaded.mjs", "./lib/ort-wasm-simd-threaded.wasm", MODEL_URL]) {
      try { const r = await fetch(f, { cache: "no-store" }); diag += `\n${f.split("/").pop()}: ${r.status}`; }
      catch (e2) { diag += `\n${f.split("/").pop()}: 取得失敗`; }
    }
    $("status").style.whiteSpace = "pre-wrap";
    $("status").textContent = "モデル読み込み失敗: " + e.message + "\n【ファイル確認】" + diag;
  }
}

function preprocess(src = video, vw = video.videoWidth, vh = video.videoHeight) {
  const scale = Math.min(SIZE / vw, SIZE / vh), w = vw * scale, h = vh * scale;
  const px = (SIZE - w) / 2, py = (SIZE - h) / 2;
  pctx.fillStyle = "#727272"; pctx.fillRect(0, 0, SIZE, SIZE);
  pctx.drawImage(src, px, py, w, h);
  const d = pctx.getImageData(0, 0, SIZE, SIZE).data, n = SIZE * SIZE;
  for (let i = 0; i < n; i++) {
    buf[i] = d[i * 4] / 255; buf[n + i] = d[i * 4 + 1] / 255; buf[2 * n + i] = d[i * 4 + 2] / 255;
  }
  return { tensor: new ort.Tensor("float32", buf, [1, 3, SIZE, SIZE]), scale, px, py };
}

// 出力 [1, 6, 8400] = 4(cx,cy,w,h) + 2クラス
function decode(out, scale, px, py, conf) {
  const N = out.dims[2], d = out.data, nc = out.dims[1] - 4, boxes = [];
  for (let i = 0; i < N; i++) {
    let c = 0, s = d[4 * N + i];
    for (let k = 1; k < nc; k++) { const v = d[(4 + k) * N + i]; if (v > s) { s = v; c = k; } }
    if (s < conf) continue;
    const cx = (d[i] - px) / scale, cy = (d[N + i] - py) / scale;
    const w = d[2 * N + i] / scale, h = d[3 * N + i] / scale;
    boxes.push({ c, s, cx, cy, w, h, x1: cx - w / 2, y1: cy - h / 2, x2: cx + w / 2, y2: cy + h / 2 });
  }
  return nms(boxes);
}
function iou(a, b) {
  const iw = Math.max(0, Math.min(a.x2, b.x2) - Math.max(a.x1, b.x1));
  const ih = Math.max(0, Math.min(a.y2, b.y2) - Math.max(a.y1, b.y1));
  const inter = iw * ih;
  return inter / (a.w * a.h + b.w * b.h - inter + 1e-9);
}
function nms(boxes) {
  boxes.sort((a, b) => b.s - a.s);
  const keep = [];
  for (const b of boxes) if (keep.every(k => k.c !== b.c || iou(k, b) < IOU_NMS)) keep.push(b);
  return keep;
}

// 簡易トラッカー(mikanのみ)。カメラの平均移動量で位置を予測して同一判定
function track(dets) {
  const used = new Set(), moves = [];
  for (const t of tracks) {
    const px = t.x + shift.x, py = t.y + shift.y;
    let bi = -1, bd = Infinity;
    dets.forEach((d, i) => {
      if (used.has(i)) return;
      const dist = Math.hypot(d.cx - px, d.cy - py);
      if (dist < bd && dist < Math.max(d.w, d.h) * 0.8) { bd = dist; bi = i; }
    });
    if (bi >= 0) {
      used.add(bi); moves.push([dets[bi].cx - t.x, dets[bi].cy - t.y]);
      t.x = dets[bi].cx; t.y = dets[bi].cy; t.hits++; t.miss = 0; dets[bi].tr = t;
      if (!t.counted && t.hits >= 3) { t.counted = true; totalCount++; }
    } else { t.miss++; t.x = px; t.y = py; }
  }
  if (moves.length >= 2) {
    const med = a => a.sort((p, q) => p - q)[a.length >> 1];
    shift = { x: 0.6 * shift.x + 0.4 * med(moves.map(m => m[0])), y: 0.6 * shift.y + 0.4 * med(moves.map(m => m[1])) };
  } else { shift = { x: shift.x * 0.8, y: shift.y * 0.8 }; }
  dets.forEach((d, i) => { if (!used.has(i)) { const t = { id: nextId++, x: d.cx, y: d.cy, hits: 1, miss: 0, counted: false }; tracks.push(t); d.tr = t; } });
  tracks = tracks.filter(t => t.miss < 15);
}

function resText() { return video.videoWidth + "×" + video.videoHeight; }

// 1フレーム分の「推論 → トラッキング → 描画」(カメラと動画で共通)
async function analyzeFrame() {
  const { tensor, scale, px, py } = preprocess();
  inferBusy = true;
  let res; try { res = await session.run({ [session.inputNames[0]]: tensor }); } finally { inferBusy = false; }
  const all = decode(res[session.outputNames[0]], scale, px, py, 0.05);
  lastAll = all;
  const th = parseFloat($("conf").value);
  const dets = all.filter(d => d.s >= th);
  const mk = dets.filter(d => d.c === CLS_MIKAN), mr = dets.filter(d => d.c === CLS_MARKER);
  track(mk);
  mikanNow = mk.length; mikanMax = Math.max(mikanMax, mikanNow);
  markerNow = mr.length; markerMax = Math.max(markerMax, markerNow);

  cv.width = video.videoWidth; cv.height = video.videoHeight;
  ctx.drawImage(video, 0, 0);
  ctx.lineWidth = Math.max(2, cv.width / 300);
  for (const b of dets) {
    ctx.strokeStyle = b.c === CLS_MIKAN ? "#f08a12" : "#2aa3ff";
    ctx.strokeRect(b.x1, b.y1, b.w, b.h);
  }
  ctx.font = `${Math.max(14, cv.width / 40)}px sans-serif`; ctx.fillStyle = "#fff";
  for (const b of dets) ctx.fillText(b.s.toFixed(2) + (lastSrc === "video" && b.tr ? " #" + b.tr.id : ""), b.x1 + 3, b.y1 + Math.max(14, cv.width / 40));
  $("big").textContent = showTotal ? totalCount : mikanNow;
  $("mk").textContent = `marker ${markerNow}`;
}

async function loop() {
  if (!running) return;
  if (!session) { try { cv.width = video.videoWidth; cv.height = video.videoHeight; ctx.drawImage(video, 0, 0); } catch (e) {} requestAnimationFrame(loop); return; }
  try {
    await analyzeFrame();
    sessFrames++; fpsFrames++;
    const now = performance.now();
    if (now - fpsStart >= 1000) { fpsNow = fpsFrames * 1000 / (now - fpsStart); fpsFrames = 0; fpsStart = now; }
    $("info").textContent = `FPS ${fpsNow.toFixed(1)} / ${resText()} / ${threads}th`;
  } catch (e) { $("status").textContent = "推論エラー: " + e.message; running = false; return; }
  requestAnimationFrame(loop);
}

async function startCamera() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  const [w, h] = $("res").value.split("x").map(Number);
  stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: "environment", width: { ideal: w }, height: { ideal: h } }, audio: false });
  video.srcObject = stream; await video.play();
  const st = stream.getVideoTracks()[0].getSettings();
  $("status").textContent = `カメラ実解像度 ${resText()} / カメラfps設定 ${st.frameRate ? Math.round(st.frameRate) : "不明"}`;
}

$("start").onclick = async () => {
  if (running) { running = false; $("start").textContent = "カメラ開始"; return; }
  try {
    await stopVideo();
    photoState = null; photoQueue = [];
    $("modeLabel").textContent = showTotal ? "累計(トラッキング)" : "いま映っている数";
    lastSrc = "camera";
    await startCamera();
    running = true; sessFrames = 0; sessStart = performance.now();
    $("start").textContent = "停止"; loop();
  } catch (e) { $("status").textContent = "カメラ使用不可(HTTPS・許可設定を確認): " + e.message; }
};
$("res").onchange = async () => { if (running) { try { await startCamera(); } catch (e) { $("status").textContent = e.message; } } };
function resetAll() {
  totalCount = 0; mikanMax = 0; markerMax = 0; tracks = []; shift = { x: 0, y: 0 };
  sessFrames = 0; sessStart = performance.now();
}
$("reset").onclick = resetAll;
$("mode").onclick = () => { showTotal = !showTotal; $("modeLabel").textContent = showTotal ? "累計(トラッキング)" : "いま映っている数"; $("big").textContent = showTotal ? totalCount : mikanNow; };
$("retry").onclick = () => { ["nothreads","coi","threadErr"].forEach(k => sessionStorage.removeItem(k)); location.reload(); };
$("conf").oninput = e => { $("confv").textContent = e.target.value; if (photoState) showPhoto(); };

function addRecord(r) {
  r.time = new Date().toISOString(); r.conf = $("conf").value;
  r.cond = $("cond").value; r.id = ++recSeq;
  const th = parseFloat(r.conf), mk = (r.all || []).filter(d => d.c === CLS_MIKAN), cnt = mk.filter(d => d.s >= th);
  r.meanConf = cnt.length ? cnt.reduce((x, d) => x + d.s, 0) / cnt.length : 0;
  r.n15 = mk.filter(d => d.s >= 0.15).length; r.n25 = mk.filter(d => d.s >= 0.25).length; r.n50 = mk.filter(d => d.s >= 0.5).length;
  records.push(r);
  const tr = document.createElement("tr");
  [r.time.slice(11, 19), r.tree, r.cond, r.max, r.total, r.marker, r.fps.toFixed(1), r.res, r.sec.toFixed(r.src === "camera" ? 0 : 2)]
    .forEach(v => { const td = document.createElement("td"); td.textContent = v; tr.appendChild(td); });
  $("tbl").tBodies[0].appendChild(tr);
}
$("rec").onclick = () => {
  if (photoState) {   // 写真モード: 今の信頼度での検出数を記録して次の写真へ
    const p = photoState;
    addRecord({ tree: $("tree").value, max: p.mk, total: p.mk, marker: p.mr, fps: 1 / p.sec,
      res: `${p.img.naturalWidth}×${p.img.naturalHeight}`, sec: p.sec, src: "photo",
      all: p.all, W: p.img.naturalWidth, H: p.img.naturalHeight });
    nextPhoto(); return;
  }
  if (lastSrc === "video") {   // 動画モード: 解析済みの結果を記録(秒=動画の長さ、FPS=解析フレーム/秒)
    if (videoJob) { $("status").textContent = "動画の解析が終わってから記録してください。"; return; }
    const dur = videoDur || 1;
    addRecord({ tree: $("tree").value, max: mikanMax, total: totalCount, marker: markerMax,
      fps: sessFrames / dur, res: video.videoWidth ? resText() : "-", sec: dur, src: "video",
      all: lastAll, W: video.videoWidth || 0, H: video.videoHeight || 0, timeline: timeline.slice() });
    resetAll(); timeline = [];
    return;
  }
  const sec = (performance.now() - sessStart) / 1000;
  addRecord({ tree: $("tree").value, max: mikanMax, total: totalCount, marker: markerMax,
    fps: sec > 0 ? sessFrames / sec : 0, res: video.videoWidth ? resText() : "-", sec, src: "camera",
    all: lastAll, W: video.videoWidth || 0, H: video.videoHeight || 0 });
  resetAll();
};

// ===== 写真モード =====
function showPhoto() {
  const p = photoState, w = p.img.naturalWidth, h = p.img.naturalHeight;
  if (!p.all) p.all = decode(p.out, p.scale, p.px, p.py, 0.05);
  const th = parseFloat($("conf").value);
  const dets = p.all.filter(d => d.s >= th);
  const mk = dets.filter(d => d.c === CLS_MIKAN), mr = dets.filter(d => d.c === CLS_MARKER);
  const k = Math.min(1, 1600 / Math.max(w, h));
  cv.width = Math.round(w * k); cv.height = Math.round(h * k);
  ctx.setTransform(k, 0, 0, k, 0, 0);
  ctx.drawImage(p.img, 0, 0, w, h);
  ctx.lineWidth = Math.max(2, w / 300);
  const fs = Math.max(14, w / 40); ctx.font = `${fs}px sans-serif`;
  for (const b of dets) {
    ctx.strokeStyle = b.c === CLS_MIKAN ? "#f08a12" : "#2aa3ff";
    ctx.strokeRect(b.x1, b.y1, b.w, b.h);
    ctx.fillStyle = "#fff"; ctx.fillText(b.s.toFixed(2), b.x1 + 3, b.y1 + fs);
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  p.mk = mk.length; p.mr = mr.length;
  $("big").textContent = p.mk; $("modeLabel").textContent = "写真の検出数";
  $("info").textContent = `写真 ${w}×${h} / ${(p.sec * 1000).toFixed(0)}ms`;
  $("mk").textContent = `marker ${p.mr}`;
}
async function nextPhoto() {
  if (!photoQueue.length) { photoState = null; $("status").textContent = "写真は以上です。"; return; }
  if (!session) { $("status").textContent = "モデルが未読込です。"; return; }
  const f = photoQueue.shift();
  try {
    running = false; $("start").textContent = "カメラ開始";
    await stopVideo();
    lastSrc = "photo";
    while (inferBusy) await new Promise(r => setTimeout(r, 50));
    if (stream) stream.getTracks().forEach(t => t.stop());
    if (photoUrl) URL.revokeObjectURL(photoUrl);
    photoUrl = URL.createObjectURL(f);
    const img = new Image(); img.src = photoUrl; await img.decode();   // EXIFの向きは自動で反映される
    const t0 = performance.now();
    const { tensor, scale, px, py } = preprocess(img, img.naturalWidth, img.naturalHeight);
    const res = await session.run({ [session.inputNames[0]]: tensor });
    photoState = { img, out: res[session.outputNames[0]], scale, px, py, name: f.name, sec: (performance.now() - t0) / 1000 };
    $("tree").value = f.name.replace(/\.[^.]+$/, "");
    showPhoto();
    $("status").textContent = `写真: ${f.name}(残り ${photoQueue.length} 枚)。信頼度を調整し「この木を記録」で保存して次へ。`;
  } catch (e) { $("status").textContent = "写真の処理に失敗: " + e.message; }
}
$("photoBtn").onclick = () => $("photo").click();
$("photo").onchange = e => { photoQueue = [...e.target.files]; e.target.value = ""; nextPhoto(); };

// ===== 動画モード =====
// 動画ファイルを一定間隔でコマ送りし、カメラと同じ検出・トラッキングで数える
async function stopVideo() {
  if (!videoJob) return;
  videoJob.cancel = true;
  while (videoJob) await sleep(30);
}
function seekTo(t) {
  return new Promise(resolve => {
    let done = false;
    const fin = () => { if (done) return; done = true; video.removeEventListener("seeked", fin); clearTimeout(tm); resolve(); };
    const tm = setTimeout(fin, 5000);   // seekedが来ない場合の保険
    video.addEventListener("seeked", fin);
    video.currentTime = t;
  });
}
async function countVideo(file) {
  if (!session) { $("status").textContent = "モデルが未読込です。"; return; }
  await stopVideo();
  running = false; $("start").textContent = "カメラ開始";
  photoState = null; photoQueue = [];
  while (inferBusy) await sleep(50);
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }

  const job = videoJob = { cancel: false };
  $("vidBtn").textContent = "解析を中止";
  try {
    video.pause(); video.srcObject = null;
    if (videoUrl) URL.revokeObjectURL(videoUrl);
    videoUrl = URL.createObjectURL(file);
    await new Promise((res, rej) => {
      video.onloadedmetadata = res;
      video.onerror = () => rej(new Error("この動画は読み込めません"));
      video.src = videoUrl; video.load();
    });
    video.onloadedmetadata = null; video.onerror = null;
    const dur = video.duration;
    if (!isFinite(dur) || dur <= 0) throw new Error("動画の長さを取得できません");
    videoDur = dur; lastSrc = "video";
    const step = parseFloat($("vstep").value) || 0.2;
    let from = parseFloat($("vfrom").value); if (!(from >= 0)) from = 0;
    let to = parseFloat($("vto").value); if (!(to > 0) || to > dur) to = dur;
    if (from >= to) from = 0;
    videoDur = to - from;
    const n = Math.floor(videoDur / step) + 1;
    resetAll(); timeline = []; $("vlog").textContent = "";
    let prevTotal = 0; const incs = [];
    $("tree").value = file.name.replace(/\.[^.]+$/, "");
    $("modeLabel").textContent = showTotal ? "累計(トラッキング)" : "いま映っている数";
    const t0 = performance.now();

    let i = 0;
    for (; i < n && !job.cancel; i++) {
      const tt = from + Math.min(i * step, videoDur);
      await seekTo(Math.min(tt + 0.001, Math.max(0, dur - 0.001)));
      await analyzeFrame();
      sessFrames++;
      timeline.push({ t: tt, now: mikanNow, total: totalCount, marker: markerNow });
      if (totalCount > prevTotal) { incs.push(`${tt.toFixed(1)}秒→${totalCount}`); prevTotal = totalCount; $("vlog").textContent = "累計が増えた時刻: " + incs.join(" / "); }
      $("info").textContent = `動画 ${tt.toFixed(1)} / ${to.toFixed(1)}秒 / ${resText()}`;
      $("status").textContent = `動画を解析中 ${i + 1}/${n} コマ(最大 ${mikanMax} / 累計 ${totalCount})`;
    }
    const el = ((performance.now() - t0) / 1000).toFixed(1);
    $("status").textContent = job.cancel
      ? `解析を中止しました(${i}/${n} コマ)。ここまでで 最大 ${mikanMax} / 累計 ${totalCount}`
      : `動画の解析が完了: 同時に映った最大 ${mikanMax} / 累計(重複なし) ${totalCount}(${n}コマ・処理 ${el}秒)。「この木を記録」で保存できます。`;
  } catch (e) {
    $("status").textContent = "動画の処理に失敗: " + e.message;
  } finally {
    videoJob = null; $("vidBtn").textContent = "動画から数える";
  }
}
$("vidBtn").onclick = () => { if (videoJob) { videoJob.cancel = true; return; } $("vfile").click(); };
$("vfile").onchange = e => { const f = e.target.files[0]; e.target.value = ""; if (f) countVideo(f); };

// CSV-BEGIN
const q = v => '"' + String(v).replace(/"/g, '""') + '"';
function summaryCsv(recs) {
  const head = "record_id,time,tree_id,condition,source,mikan_max_in_frame,mikan_tracked_total,marker_max,mean_conf,n_conf_ge_0.15,n_conf_ge_0.25,n_conf_ge_0.50,avg_fps,resolution,duration_s,conf_threshold\n";
  return head + recs.map(r => [r.id, r.time, q(r.tree), q(r.cond || ""), r.src || "camera", r.max, r.total, r.marker,
    r.meanConf.toFixed(4), r.n15, r.n25, r.n50, r.fps.toFixed(2), r.res, r.sec.toFixed(2), r.conf].join(",")).join("\n");
}
function detCsv(recs) {
  const head = "record_id,tree_id,condition,source,image_w,image_h,class,rank,confidence,x1,y1,x2,y2,box_w_px,box_h_px,box_w_rel,box_area_rel,counted,counted_no\n";
  const rows = [], names = { [CLS_MARKER]: "marker", [CLS_MIKAN]: "mikan" };
  for (const r of recs) {
    const th = parseFloat(r.conf), W = r.W || 1, H = r.H || 1;
    let k = 0;
    [...(r.all || [])].sort((a, b) => b.s - a.s).forEach((d, i) => {
      const counted = d.c === CLS_MIKAN && d.s >= th, no = counted ? ++k : "";
      const x1 = Math.max(0, d.x1), y1 = Math.max(0, d.y1), x2 = Math.min(W, d.x2), y2 = Math.min(H, d.y2);
      const bw = Math.max(0, x2 - x1), bh = Math.max(0, y2 - y1);
      rows.push([r.id, q(r.tree), q(r.cond || ""), r.src || "camera", r.W, r.H, names[d.c] || d.c, i + 1, d.s.toFixed(4),
        x1.toFixed(1), y1.toFixed(1), x2.toFixed(1), y2.toFixed(1), bw.toFixed(1), bh.toFixed(1),
        (bw / W).toFixed(4), (bw * bh / (W * H)).toFixed(5), counted ? 1 : 0, no].join(","));
    });
  }
  return head + rows.join("\n");
}
function wideCsv(recs) {
  const rows = recs.map(r => {
    const th = parseFloat(r.conf);
    const c = (r.all || []).filter(d => d.c === CLS_MIKAN && d.s >= th).map(d => d.s).sort((a, b) => b - a);
    return { r, c };
  });
  const n = Math.max(0, ...rows.map(x => x.c.length));
  const cols = Array.from({ length: n }, (_, i) => "conf_" + (i + 1));
  const head = ["record_id", "tree_id", "condition", "source", "image_w", "image_h", "mikan_count", "mean_conf", "conf_threshold", ...cols].join(",") + "\n";
  return head + rows.map(({ r, c }) => [r.id, q(r.tree), q(r.cond || ""), r.src || "camera", r.W, r.H, c.length,
    r.meanConf.toFixed(4), r.conf, ...Array.from({ length: n }, (_, i) => i < c.length ? c[i].toFixed(4) : "")].join(",")).join("\n");
}
// 動画の時間経過(コマごとの「いま映っている数」と累計)
function timelineCsv(recs) {
  const head = "record_id,tree_id,condition,time_s,mikan_now,mikan_tracked_total,marker_now\n";
  const rows = [];
  for (const r of recs) for (const p of (r.timeline || []))
    rows.push([r.id, q(r.tree), q(r.cond || ""), p.t.toFixed(2), p.now, p.total, p.marker].join(","));
  return head + rows.join("\n");
}
// CSV-END
function download(name, text) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["\ufeff" + text], { type: "text/csv" }));
  a.download = name; a.click();
}
$("csv").onclick = () => download("mikan_summary.csv", summaryCsv(records));
$("wcsv").onclick = () => download("mikan_per_image.csv", wideCsv(records));
$("dcsv").onclick = () => download("mikan_detections.csv", detCsv(records));
$("tcsv").onclick = () => download("mikan_video_timeline.csv", timelineCsv(records));
$("clr").onclick = () => { records = []; recSeq = 0; $("tbl").tBodies[0].innerHTML = ""; };

(async function boot() {
  if ("serviceWorker" in navigator) {
    try { await navigator.serviceWorker.register("./sw.js"); } catch (e) {}
    if (!crossOriginIsolated && !sessionStorage.getItem("coi")) {
      sessionStorage.setItem("coi", "1");
      await navigator.serviceWorker.ready; location.reload(); return;
    }
  }
  loadModel();
})();
