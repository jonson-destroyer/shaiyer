name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Fetch onnxruntime-web into lib/
        run: |
          npm install onnxruntime-web@1.22.0
          mkdir -p _site/lib
          cp node_modules/onnxruntime-web/dist/ort.min.js _site/lib/
          cp node_modules/onnxruntime-web/dist/ort-wasm-simd-threaded.wasm _site/lib/
          cp node_modules/onnxruntime-web/dist/ort-wasm-simd-threaded.mjs _site/lib/
          cp index.html sw.js manifest.json _site/
          cp -r model _site/
          ls -la _site/lib
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deployment
        uses: actions/deploy-pages@v4
